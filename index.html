<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <title>Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            font-family: sans-serif;
            color: rgb(255, 255, 255);
            justify-content: center;
            align-items: center;
        }

        .container{
            background-color: black;
            border: 4px solid rgb(84, 80, 80);
            position: relative;
            width: 70%;
            height: 80%;
            border-radius: 8px;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            
        }
        .instructions{
            position: absolute;
            bottom:2%;
            left:5%;
            right:5%;
            text-align: center;
        }

    </style>

</head>

<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="instructions">
            <P>Use Left and Right Arrow to Move</P>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
